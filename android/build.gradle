group 'uz.udevs.udevs_video_player'
version '1.0-SNAPSHOT'

// Compose/Media3 version used in dependencies
def media3_version = '1.2.1'

plugins {
    id 'com.android.library' version '8.1.4'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21'
}

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'uz.udevs.udevs_video_player'
    compileSdk 34

    defaultConfig {
        minSdkVersion 21
        multiDexEnabled true
    }

    buildFeatures {
        compose true
    }
    // DO NOT set composeOptions/kotlinCompilerExtensionVersion when using the compose plugin

    // Use Java 17 with Kotlin 2.x / AGP 8.x
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            res {
                srcDirs 'src\\main\\res'
            }
        }
        main.java.srcDirs += 'src/main/kotlin'
    }

    // (Deprecated but harmless if you need it)
    aaptOptions {
        noCompress 'mp4'
    }
}

dependencies {
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-datasource-cronet:$media3_version"

    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.code.gson:gson:2.10'
    implementation 'com.github.bumptech.glide:glide:4.15.1'

    // retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation "com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.6"

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.mediarouter:mediarouter:1.6.0'
    implementation 'com.google.android.gms:play-services-cast-framework:21.4.0'

    implementation 'org.checkerframework:checker-qual:3.33.0'
    implementation 'com.google.android.gms:play-services-cronet:18.0.1'

    // Compose BOM keeps runtime libs aligned
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation platform('androidx.compose:compose-bom:2024.06.00')

    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation "io.coil-kt:coil-compose:2.4.0"
}
