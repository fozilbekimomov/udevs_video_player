group 'uz.udevs.udevs_video_player'
version '1.0-SNAPSHOT'

buildscript {
    ext.media3_version = '1.2.1'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP can stay if your root uses 8.1.4; upgrade later at the root if needed.
        classpath 'com.android.tools.build:gradle:8.1.4'

        // IMPORTANT: Kotlin 2.0.x to enable the Compose Gradle plugin
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// NEW: Compose Compiler Gradle plugin (works with Kotlin 2.0.x)
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'uz.udevs.udevs_video_player'
    compileSdk 34

    buildFeatures {
        compose true
    }

    // REMOVE legacy composeOptions block; the plugin handles compiler matching:
    // composeOptions { kotlinCompilerExtensionVersion "1.5.2" }

    // Use Java 17 toolchain with Kotlin 2.x / modern AGP
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            res {
                srcDirs 'src\\main\\res'
            }
        }
        main.java.srcDirs += 'src/main/kotlin'
    }

    // aaptOptions is deprecated; keep only if you really need it
    aaptOptions {
        noCompress 'mp4'
    }

    defaultConfig {
        minSdkVersion 21
        multiDexEnabled true
    }
}

dependencies {
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-datasource-cronet:$media3_version"

    def multidex_version = "2.0.1"
    implementation "androidx.multidex:multidex:$multidex_version"
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.code.gson:gson:2.10'
    implementation 'com.github.bumptech.glide:glide:4.15.1'

    // retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation "com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.6"

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.mediarouter:mediarouter:1.6.0'
    implementation 'com.google.android.gms:play-services-cast-framework:21.4.0'

    implementation 'org.checkerframework:checker-qual:3.33.0'
    implementation 'com.google.android.gms:play-services-cronet:18.0.1'

    // Compose BOM keeps runtime libs aligned; keep your existing one or bump later
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation("io.coil-kt:coil-compose:2.4.0")
}
