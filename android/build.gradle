group 'uz.udevs.udevs_video_player'
version '1.0-SNAPSHOT'

buildscript {
    ext.media3_version = '1.2.1'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Keep AGP aligned with your root; 8.1.4 is fine here
        classpath 'com.android.tools.build:gradle:8.1.4'

        // Kotlin 2.0.x (required for the Compose Gradle plugin approach)
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"

        // IMPORTANT: add the Compose Compiler Gradle plugin to the classpath
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.21"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose' // <-- now resolvable

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'uz.udevs.udevs_video_player'
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        multiDexEnabled true
    }

    buildFeatures {
        compose true
    }
    // DO NOT use composeOptions/kotlinCompilerExtensionVersion with the compose plugin

    // Java 17 toolchain for Kotlin 2.x / AGP 8.x
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            // Use POSIX path to avoid issues on macOS/Linux
            res.srcDirs = ['src/main/res']
            java.srcDirs += 'src/main/kotlin'
        }
    }

    // (Deprecated but harmless if you need it)
    aaptOptions {
        noCompress 'mp4'
    }
}

dependencies {
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-datasource-cronet:$media3_version"

    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.code.gson:gson:2.10'
    implementation 'com.github.bumptech.glide:glide:4.15.1'

    // retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation "com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.6"

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.mediarouter:mediarouter:1.6.0'
    implementation 'com.google.android.gms:play-services-cast-framework:21.4.0'

    implementation 'org.checkerframework:checker-qual:3.33.0'
    implementation 'com.google.android.gms:play-services-cronet:18.0.1'

    // Compose BOM keeps runtime libs aligned
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation platform('androidx.compose:compose-bom:2024.06.00')

    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation "io.coil-kt:coil-compose:2.4.0"
}
